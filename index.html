<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창원 자전거 보관소·대여소 찾기</title>
<!-- 지도: Leaflet + OpenStreetMap (키 필요 없음) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
  :root {
    --bg: #f2f5f3; --surface: #ffffff; --ink: #15241d; --muted: #5a6b62; --line: #d5dfd9;
    --accent: #13795b; --accent-ink: #ffffff;
    --storage: #1f5fa8; --storage-bg: #e6eef8;
    --rental: #b4511b; --rental-bg: #fbeee5;
    --warn: #9a5b00; --warn-bg: #fff3dc;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1613; --surface: #18221d; --ink: #e6efe9; --muted: #9db0a5; --line: #2b3a32;
      --accent: #3fbf8f; --accent-ink: #0b1510;
      --storage: #8db8ee; --storage-bg: #1c2a3b;
      --rental: #f0a274; --rental-bg: #3a2519;
      --warn: #f2be6b; --warn-bg: #3a2c12;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    font-size: 17px; line-height: 1.55; word-break: keep-all; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.45rem; line-height: 1.3; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  .controls { display: grid; gap: 10px; }
  button, select { font: inherit; border-radius: 10px; min-height: 48px; }
  #nearBtn { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }
  #nearBtn:disabled { opacity: .6; cursor: wait; }
  .or { display: flex; align-items: center; gap: 10px; }
  .or label { font-weight: 700; white-space: nowrap; }
  select { flex: 1; padding: 0 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #message { margin: 18px 0 10px; font-weight: 700; min-height: 1.5em; }
  #message.warn { background: var(--warn-bg); color: var(--warn); padding: 10px 12px; border-radius: 8px; }
  #message .retry { margin-left: 8px; min-height: 36px; padding: 0 12px; border: 1px solid currentColor;
    background: transparent; color: inherit; cursor: pointer; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: .8rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .tag.storage { color: var(--storage); background: var(--storage-bg); }
  .tag.rental { color: var(--rental); background: var(--rental-bg); }
  .name { font-weight: 700; }
  .dist { margin-left: auto; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .meta { color: var(--muted); font-size: .95rem; margin-top: 4px; }
  .status { display: inline-block; margin-top: 6px; font-size: .9rem; font-weight: 700; color: var(--warn); }
  .status.open { color: var(--accent); }
  .map { display: inline-block; margin-top: 8px; font-size: .95rem; color: var(--accent); font-weight: 700;
    background: none; border: 0; padding: 0; min-height: 0; cursor: pointer; text-decoration: underline; }
  #mapWrap { margin-bottom: 14px; }
  #map { height: 320px; border: 1px solid var(--line); border-radius: 12px; z-index: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.25); vertical-align: -1px; margin-right: 4px; }
  .tri { color: #c62828; margin-right: 4px; }
  .slope-icon { color: #c62828; font-size: 16px; line-height: 16px; text-align: center;
    text-shadow: 0 0 2px #fff, 0 0 2px #fff; }
  .leaflet-popup-content { font-size: 14px; line-height: 1.45; margin: 10px 12px; }
  .leaflet-popup-content b { font-size: 15px; }
  .leaflet-popup-content a { color: #13795b; font-weight: 700; }
  .slope { margin-top: 8px; font-size: .9rem; }
  .slope summary { cursor: pointer; font-weight: 700; color: var(--warn); }
  .slope.none { color: var(--muted); }
  .slope ul { margin: 6px 0 0; padding-left: 0; }
  .slope li, .roads li { border: 0; border-radius: 0; padding: 6px 0; margin: 0; background: none;
    border-top: 1px dashed var(--line); }
  .slope .note, .roads .note { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
  .roads { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .roads summary { cursor: pointer; font-weight: 700; }
  .roads ul { margin-top: 8px; }
  .roads .rname { font-weight: 700; }
  .roads .meta { margin-top: 2px; }
  footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
  footer p { margin: 0 0 4px; }
</style>
</head>
<body>
<main>
  <h1>창원 자전거 보관소·대여소 찾기</h1>
  <p class="lead">가까운 자전거 보관소와 대여소를 지도와 목록으로 찾아 드려요.</p>

  <div class="controls">
    <button id="nearBtn" type="button">📍 내 위치로 찾기</button>
    <div class="or">
      <label for="gu">또는 구 선택</label>
      <select id="gu"><option value="">구를 고르세요</option></select>
    </div>
  </div>

  <p id="message" role="status" aria-live="polite"></p>
  <div id="mapWrap" hidden>
    <div id="map" role="region" aria-label="검색 결과 지도"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--rental)"></span>대여소</span>
      <span><span class="dot" style="background:var(--storage)"></span>보관소만</span>
      <span><span class="dot" style="background:var(--accent)"></span>내 위치</span>
      <span><span class="tri">▲</span>급경사지</span>
    </div>
  </div>
  <ul id="list"></ul>
  <div id="roads"></div>

  <footer id="sources">
    <p>데이터 출처를 불러오는 중…</p>
  </footer>
</main>

<script>
  // 화면은 Supabase를 직접 부르지 않는다: 화면 → /api/places → Supabase
  const $ = (id) => document.getElementById(id);
  const nearBtn = $("nearBtn"), guSelect = $("gu"), message = $("message"), list = $("list");

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const formatDistance = (m) => (m < 1000 ? `${m}m` : `${(m / 1000).toFixed(1)}km`);
  const mapLink = (p) =>
    `https://map.kakao.com/link/map/${encodeURIComponent(p.name)},${p.lat},${p.lng}`;

  function setMessage(text, warn = false, retry = false) {
    message.className = warn ? "warn" : "";
    message.innerHTML = esc(text) + (retry ? ' <button class="retry" type="button">다시 시도</button>' : "");
    if (retry) message.querySelector(".retry").onclick = findNear;
  }

  async function getJson(url) {
    const res = await fetch(url);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || "데이터를 불러오지 못했습니다.");
    return body;
  }

  // 한 장소에 대여소·보관소가 함께 있으면 표시도 둘 다 붙인다
  function tags(p) {
    const t = [];
    if (p.type === "rental") t.push(`<span class="tag rental">${p.service === "nubija" ? "누비자 대여소" : "대여소"}</span>`);
    if (p.racks != null) t.push('<span class="tag storage">보관소</span>');
    return t.join("");
  }

  // 300m 안 급경사지(붕괴 위험 비탈면) 요약 · 눌러서 자세히
  function slopeBlock(s) {
    if (!s || !s.count) return ""; // 없으면 카드를 깔끔하게 둔다 (화면 아래 안내 참고)
    const head = `⚠️ 300m 안 급경사지 ${s.count}곳` +
      (s.maxAngle != null ? ` · 최대 경사 ${s.maxAngle}°` : "") +
      (s.designated ? ` · 지정 위험지역 ${s.designated}곳` : "");
    const items = s.items.map((i) => `<li>
        <b>${esc(i.name)}</b> · 약 ${formatDistance(i.distance)}<br>
        <span class="meta">${esc(i.kind)}${i.angle != null ? ` · 경사 ${i.angle}°` : ""}${i.height != null ? ` · 높이 ${i.height}m` : ""}${i.rating ? ` · 등급 ${esc(i.rating)}` : ""}${i.designated ? " · 지정 위험지역" : ""}</span>
      </li>`).join("");
    return `<details class="slope"><summary>${esc(head)}</summary><ul>${items}</ul>
      <p class="note">자전거길 오르막이 아니라 무너질 위험이 있는 비탈면(옹벽·석축 등)입니다. 위치는 약 100m 오차가 있어요.${s.count > 5 ? " 가까운 5곳만 보여요." : ""}</p></details>`;
  }

  // 구를 고르면 그 구를 지나는 자전거도로 목록 (좌표가 없는 자료라 목록으로만)
  function renderRoads(gu, roads) {
    const box = $("roads");
    if (!roads || !roads.length) { box.innerHTML = ""; return; }
    const total = roads.reduce((a, r) => a + (r.lengthKm || 0), 0);
    box.innerHTML = `<details class="roads"><summary>🚲 ${esc(gu)} 자전거도로 ${roads.length}개 구간 · 총 ${total.toFixed(1)}km</summary>
      <ul>${roads.map((r) => `<li>
        <span class="rname">${esc(r.name)}</span> <span class="meta">${esc(r.type)}</span>
        <div class="meta">${r.lengthKm != null ? `${r.lengthKm}km` : ""}${r.widthM ? ` · 너비 ${r.widthM}m` : ""}</div>
        <div class="meta">${esc(shortAddr(r.from))} → ${esc(shortAddr(r.to))}</div>
      </li>`).join("")}</ul>
      <p class="note">자료에 좌표가 없어 지도·거리 계산은 할 수 없어요. 기점·종점 주소로 표시합니다.</p></details>`;
  }
  const shortAddr = (a) => String(a || "").replace(/^(경상남도|경남)\s*창원시\s*/, "");

  // ── 화면 안 지도 (Leaflet + OpenStreetMap) ──────────────────────────
  let map = null, layer = null, markers = {}, shown = [];
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const slopeIcon = () => L.divIcon({ className: "slope-icon", html: "▲", iconSize: [16, 16] });

  function ensureMap() {
    if (!window.L) return null; // 지도 파일을 못 불러오면 지도 없이 목록만
    $("mapWrap").hidden = false;
    if (!map) {
      map = L.map("map", { scrollWheelZoom: false });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);
      layer = L.layerGroup().addTo(map);
    }
    return map;
  }

  function popupHtml(p) {
    const kind = [p.type === "rental" ? (p.service === "nubija" ? "누비자 대여소" : "대여소") : "",
      p.racks != null ? `보관대 ${p.racks}대` : ""].filter(Boolean).join(" · ");
    return `<b>${esc(p.name)}</b><br>${esc(kind)}${p.distance != null ? ` · ${formatDistance(p.distance)}` : ""}<br>
      <span>${esc(p.address)}</span><br>
      <a href="${mapLink(p)}" target="_blank" rel="noopener">길찾기 (카카오맵) ›</a>`;
  }

  // 목록에 나온 장소 · 내 위치 · 근처 급경사지를 지도에 그린다
  function drawMap(places, me) {
    const m = ensureMap();
    if (!m) return;
    layer.clearLayers();
    markers = {};
    const bounds = [];
    const seenSlopes = new Set();
    for (const p of places) {
      for (const s of p.slopes?.items || []) {
        const key = `${s.lat},${s.lng},${s.name}`;
        if (seenSlopes.has(key) || !Number.isFinite(s.lat)) continue;
        seenSlopes.add(key);
        L.marker([s.lat, s.lng], { icon: slopeIcon(), keyboard: false })
          .bindPopup(`<b>⚠️ ${esc(s.name)}</b><br>${esc(s.kind)}${s.angle != null ? ` · 경사 ${s.angle}°` : ""}${s.rating ? ` · 등급 ${esc(s.rating)}` : ""}<br><span>붕괴 위험 비탈면 · 위치 약 100m 오차</span>`)
          .addTo(layer);
      }
    }
    for (const p of places) {
      const color = p.type === "rental" ? cssVar("--rental") : cssVar("--storage");
      markers[p.id] = L.circleMarker([p.lat, p.lng], {
        radius: 8, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1,
      }).bindPopup(popupHtml(p)).addTo(layer);
      bounds.push([p.lat, p.lng]);
    }
    if (me) {
      L.circleMarker(me, { radius: 8, color: "#fff", weight: 3, fillColor: cssVar("--accent"), fillOpacity: 1 })
        .bindTooltip("내 위치").addTo(layer);
      bounds.push(me);
    }
    m.invalidateSize();
    if (bounds.length) m.fitBounds(bounds, { padding: [28, 28], maxZoom: 17 });
  }

  // 카드의 "지도에서 보기" → 위 지도에서 그 장소를 크게 보여 준다
  function focusPlace(id) {
    const p = shown.find((x) => x.id === id);
    if (!p) return;
    if (!map || !markers[id]) { window.open(mapLink(p), "_blank", "noopener"); return; } // 지도가 없으면 카카오맵
    $("mapWrap").scrollIntoView({ behavior: "smooth", block: "start" });
    map.setView([p.lat, p.lng], 17);
    markers[id].openPopup();
  }
  list.addEventListener("click", (e) => {
    const btn = e.target.closest("button.map");
    if (btn) focusPlace(btn.dataset.id);
  });

  function render(places, me) {
    shown = places;
    drawMap(places, me);
    $("roads").innerHTML = "";
    list.innerHTML = places.map((p) => {
      const lines = [];
      if (p.terminalNo) lines.push(`터미널 ${p.terminalNo}번`);
      if (p.racks != null) lines.push(`보관대 ${p.racks}대`);
      if (p.bikes != null) lines.push(`보유 자전거 ${p.bikes}대`);
      if (p.hours) lines.push(`운영 ${p.hours}`);
      if (p.fee) lines.push(`요금 ${p.fee}`);
      const status = p.status
        ? `<span class="status ${p.status.status === "open" ? "open" : ""}">${esc(p.status.label)}</span><br>` : "";
      return `<li>
        <div class="top">
          ${tags(p)}
          <span class="name">${esc(p.name)}</span>
          ${p.distance != null ? `<span class="dist">${formatDistance(p.distance)}</span>` : ""}
        </div>
        <div class="meta">${esc(p.address)}</div>
        <div class="meta">${lines.map(esc).join(" · ")}</div>
        ${status}
        ${slopeBlock(p.slopes)}
        <button class="map" type="button" data-id="${esc(p.id)}">지도에서 보기 ›</button>
      </li>`;
    }).join("");
  }

  // ① 내 위치로 찾기 (학습 노트: getCurrentPosition · err.code 1·2·3 · timeout 5000)
  const GEO_ERROR = {
    1: "위치 사용이 허용되지 않았어요. 아래에서 구를 골라 주세요.",
    2: "지금 위치를 알 수 없어요. 아래에서 구를 골라 주세요.",
    3: "위치 확인이 오래 걸려요.",
  };

  function findNear() {
    if (!("geolocation" in navigator)) {
      return setMessage("이 브라우저는 위치 찾기를 지원하지 않아요. 구를 골라 주세요.", true);
    }
    nearBtn.disabled = true;
    list.innerHTML = "";
    setMessage("위치 확인 중…");
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        try {
          // 소수 4자리(약 10m)로 줄여서 보낸다
          const lat = pos.coords.latitude.toFixed(4), lng = pos.coords.longitude.toFixed(4);
          setMessage("가까운 곳을 찾는 중…");
          const data = await getJson(`/api/places?lat=${lat}&lng=${lng}`);
          guSelect.value = "";
          setMessage(`내 위치에서 가까운 ${data.places.length}곳`);
          render(data.places, [pos.coords.latitude, pos.coords.longitude]);
        } catch (e) {
          setMessage(e.message, true, true);
        } finally {
          nearBtn.disabled = false;
        }
      },
      (err) => {
        nearBtn.disabled = false;
        setMessage(GEO_ERROR[err.code] || "위치를 확인하지 못했어요.", true, err.code === 3);
        guSelect.focus();
      },
      { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
    );
  }

  // ② 구로 찾기
  async function findByGu() {
    const gu = guSelect.value;
    if (!gu) return;
    list.innerHTML = "";
    setMessage(`${gu} 불러오는 중…`);
    try {
      const data = await getJson(`/api/places?gu=${encodeURIComponent(gu)}`);
      const rental = data.places.filter((p) => p.type === "rental").length;
      const storage = data.places.filter((p) => p.racks != null).length;
      setMessage(`${gu} · ${data.places.length}곳 (대여소 ${rental} · 보관소 ${storage}, 겹치는 곳 포함)`);
      render(data.places);
      renderRoads(gu, data.roads);
    } catch (e) {
      setMessage(e.message, true);
    }
  }

  // 첫 화면: 구 목록 · 데이터 기준일과 출처
  async function init() {
    try {
      const data = await getJson("/api/places");
      guSelect.insertAdjacentHTML("beforeend",
        data.gus.map((g) => `<option value="${esc(g)}">${esc(g)}</option>`).join(""));
      $("sources").innerHTML = data.sources.map((s) =>
        `<p>${esc(s.label)} ${s.count}${s.key === "roads" ? "개" : "곳"} · 기준일 ${esc(s.dataDate || "확인 필요")} · 출처: ${esc(s.name)}</p>`
      ).join("") +
        "<p>누비자 터미널과 50m 안에 있는 보관소는 한 곳으로 합쳐 보여 줍니다. 실시간 대여 가능 대수와 보관소 빈자리는 포함되지 않았습니다.</p>" +
        "<p>급경사지는 자전거길 오르막이 아니라 붕괴 위험 비탈면 자료입니다.</p>";
    } catch (e) {
      $("sources").innerHTML = `<p>${esc(e.message)}</p>`;
    }
  }

  nearBtn.addEventListener("click", findNear);
  guSelect.addEventListener("change", findByGu);
  init();
</script>
</body>
</html>
