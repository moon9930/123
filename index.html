<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창원 한파쉼터 찾기</title>
<style>
  :root {
    --bg: #f3f6f9; --surface: #ffffff; --ink: #14212e; --muted: #5a6876;
    --line: #d6dee6; --open: #0b6e4f; --closed: #8a96a3; --unknown: #a35a00;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161c; --surface: #19222b; --ink: #e8eef4; --muted: #9eabb8;
      --line: #2c3946; --open: #4cc79b; --closed: #6b7784; --unknown: #f0a54a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    font-size: 17px; line-height: 1.55; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  label { font-weight: 700; margin-right: 8px; }
  select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--ink); min-width: 10em; }
  select:focus-visible { outline: 3px solid var(--open); outline-offset: 2px; }
  #summary { margin: 18px 0 8px; font-weight: 700; min-height: 1.5em; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px; }
  .name { font-weight: 700; }
  .badge { font-size: 0.9rem; font-weight: 700; margin-left: 6px; }
  .open .badge { color: var(--open); }
  .closed { opacity: 0.55; }
  .closed .badge { color: var(--closed); }
  .unknown .badge { color: var(--unknown); }
  .meta { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
  .msg { color: var(--muted); }
  footer { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 0.85rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>창원 한파쉼터 찾기</h1>

  <!-- 완료 기준 1: 행정동 선택 → 목록 -->
  <div>
    <label for="dong">행정동</label>
    <select id="dong" disabled><option>불러오는 중…</option></select>
  </div>

  <p id="summary" role="status" aria-live="polite"></p>
  <!-- 완료 기준 2·3: 운영 상태, 주소 · 인원 · 오늘 운영 시간 -->
  <ul id="list"></ul>

  <!-- 완료 기준 4: 출처 · 기준일 -->
  <footer>
    출처: 공공데이터포털 ·
    <a href="https://www.data.go.kr" target="_blank" rel="noopener">경상남도 창원시_한파쉼터 지정 현황</a>
    · 데이터 기준일 <span id="dataDate">확인 중</span><br>
    지정 현황 자료라 실제 휴관 여부는 반영되지 않습니다. 방문 전 전화로 확인하세요.
  </footer>
</main>

<script>
  const dongEl = document.getElementById("dong");
  const listEl = document.getElementById("list");
  const summaryEl = document.getElementById("summary");
  const dateEl = document.getElementById("dataDate");
  const LABEL = { open: "운영 중", closed: "운영 종료", unknown: "운영 시간 확인 필요" };

  function setDate(d) { if (d) dateEl.textContent = d; }

  async function loadDongs() {
    // 파일을 더블클릭해서 열면 서버 함수(api/)가 없어 데이터를 못 부른다
    if (location.protocol === "file:") {
      dongEl.innerHTML = "<option>서버 필요</option>";
      summaryEl.textContent = "파일을 직접 열면 데이터를 불러올 수 없습니다. 터미널에서 npm run dev 를 실행하고 http://localhost:3000 으로 여세요.";
      return;
    }
    try {
      const res = await fetch("/api/shelters");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      dongEl.innerHTML = '<option value="">동을 고르세요</option>';
      for (const d of data.dongs) {
        const o = document.createElement("option");
        o.value = d; o.textContent = d;
        dongEl.append(o);
      }
      dongEl.disabled = false;
      setDate(data.dataDate);
    } catch (e) {
      dongEl.innerHTML = "<option>불러오기 실패</option>";
      summaryEl.textContent = "행정동 목록을 불러오지 못했습니다. 새로고침해 보세요.";
    }
  }

  async function loadShelters(dong) {
    listEl.innerHTML = "";
    if (!dong) { summaryEl.textContent = ""; return; }
    summaryEl.textContent = "불러오는 중…";
    try {
      const res = await fetch("/api/shelters?dong=" + encodeURIComponent(dong));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      setDate(data.dataDate);
      const n = (s) => data.shelters.filter((x) => x.status === s).length;
      summaryEl.textContent = data.shelters.length
        ? `지금 운영 중 ${n("open")}곳 · 운영 종료 ${n("closed")}곳` + (n("unknown") ? ` · 확인 필요 ${n("unknown")}곳` : "")
        : "이 동에는 등록된 쉼터가 없습니다.";
      for (const s of data.shelters) {
        const li = document.createElement("li");
        li.className = s.status;
        const title = document.createElement("div");
        const name = document.createElement("span");
        name.className = "name"; name.textContent = s.name;
        const badge = document.createElement("span");
        badge.className = "badge"; badge.textContent = "· " + LABEL[s.status];
        title.append(name, badge);
        const meta = document.createElement("div");
        meta.className = "meta";
        const hours = s.todayHours ? "오늘 " + s.todayHours
          : s.status === "unknown" ? "표기: " + (s.rawHours || "없음") : "오늘 운영 안 함";
        meta.textContent = [s.address, s.capacity != null ? s.capacity + "명" : null, hours]
          .filter(Boolean).join(" · ");
        li.append(title, meta);
        listEl.append(li);
      }
    } catch (e) {
      summaryEl.textContent = "쉼터 목록을 불러오지 못했습니다. 잠시 후 다시 고르세요.";
    }
  }

  dongEl.addEventListener("change", () => loadShelters(dongEl.value));
  loadDongs();
</script>
</body>
</html>
